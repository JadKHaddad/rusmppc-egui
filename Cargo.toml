[package]
name = "rusmppc-egui"
version = "0.1.12"
edition = "2024"

[dependencies]
eframe = { version = "0.33.3", features = ["persistence"] }
egui = { version = "0.33.3" }
egui_dock = { version = "0.18.0", features = ["serde"] }
egui_material_icons = "0.5.0"
egui_virtual_list = "0.9.0"

tokio = { version = "1.54.1", features = ["sync"] }
futures = "0.3.34"
parking_lot = "0.13.0"
rusmpp = { git = "https://github.com/Rusmpp/Rusmpp", rev = "3b5a9b80e63babcce37eb666c07dd65bef33c020", package = "rusmpp" }
strum = { version = "0.28.0", features = ["derive"] }
anyhow = "1.0.104"
url = "2.5.7"
serde = { version = "1.0.229", features = ["derive"] }
tokio-util = { version = "0.7.20", features = ["compat"] }
tracing = "0.1.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
image = "0.25.10"
exr = "1.74.3"
rusmppc = { git = "https://github.com/Rusmpp/Rusmpp", rev = "3b5a9b80e63babcce37eb666c07dd65bef33c020", package = "rusmppc", default-features = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1.0.154"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
gloo-net = { version = "0.7.0", features = ["websocket", "io-util"] }
rusmppc = { git = "https://github.com/Rusmpp/Rusmpp", rev = "3b5a9b80e63babcce37eb666c07dd65bef33c020", package = "rusmppc", default-features = false, features = [
    "wasm",
] }
